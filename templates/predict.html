<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Price Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .navbar {
            display: flex;
            justify-content: space-between;
            background: #2c3e50;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        .navbar a:hover {
            text-decoration: underline;
        }

        .container {
            width: 450px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #b0b0b0;
        }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION BAR -->
    <div class="navbar">
        <div>
            <a href="/predict">Predict</a>
            <a href="/history">History</a>
        </div>
        <div>
            <a href="/logout">Logout</a>
        </div>
    </div>

    <div class="container">
        <h2>Housing Price Prediction</h2>

        {% if error %}
            <p style="color:red;">{{ error }}</p>
        {% endif %}

        {% if result %}
            <p style="color:green; font-weight:bold;">
                Predicted Price: ${{ result }}
            </p>
        {% endif %}

        <form action="/predict" method="POST">
            <label>Area (sqft):</label>
            <input type="number" name="area" step="0.01" required>

            <label>Beds:</label>
            <input type="number" name="beds" step="1" required>

            <label>Baths:</label>
            <input type="number" name="baths" step="1" required>

            <button type="submit">Predict Price</button>
        </form>
    </div>

</body>
</html>
