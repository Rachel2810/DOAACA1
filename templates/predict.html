{% extends "base.html" %}
{% block content %}

<h2>Make a Prediction</h2>

<form method="POST">
    <input type="number" step="0.01" name="feature1" placeholder="Feature 1" required><br>
    <input type="number" step="0.01" name="feature2" placeholder="Feature 2" required><br>
    <input type="number" step="0.01" name="feature3" placeholder="Feature 3" required><br>
    <button type="submit">Predict</button>
</form>

{% if result %}
<h3>Prediction: {{ result }}</h3>
{% endif %}

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

{% endblock %}
